# 데모 앱 (기본): docker compose up   → http://localhost:8501  (API 키·Neo4j·인터넷 없이 예시 재생·목록 조회)
# 로컬 Neo4j (선택): docker compose --profile neo4j up -d   / 중지: docker compose --profile neo4j down
#   비밀번호는 .env의 NEO4J_PASSWORD, 데이터는 ./neo4j/ (git 제외). 포트는 이 PC에서만 접속 가능
services:
  demo:
    build: .
    image: safety-graphrag-demo
    ports:
      - "127.0.0.1:8501:8501"
  neo4j:
    profiles: ["neo4j"]
    image: neo4j:5.26-community
    container_name: safety-agent-neo4j
    ports:
      - "127.0.0.1:7474:7474"  # 브라우저 (같은 네트워크의 다른 PC에서는 접속 불가)
      - "127.0.0.1:7687:7687"  # bolt
    environment:
      # 데모만 띄울 때도 compose가 이 줄을 해석하므로 필수(:?)로 두지 않는다. 비어 있으면 Neo4j만 시작에 실패한다
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-}
    volumes:
      - ./neo4j/data:/data
